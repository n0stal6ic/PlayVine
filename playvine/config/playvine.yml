# Default configuration file for PlayVine.
# DO NOT edit this file directly.

decrypter: 'packager'
tag: 'NOGRP'
tag_sd: 'NOGRP'

arguments: {}

aria2c:
  file_allocation: 'prealloc'

# Set each to the filename of your device file.
cdm:
  default: 'your_device_name'
  # MyService1: 'your_pr_device_sl3000'
  # MyService2: 'your_wv_device_l1'

cdm_api: []

# Add login credentials for a service.
credentials:
  # MyService1: 'email:password'
  # MyService2:
  #   profile1: 'email:password'
  #   profile2: 'other@email.com:password'

directories:
  temp: ''

headers:
  User-Agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36 Edg/121.0.0.0'

key_vaults:
  - type: 'local'
    name: 'Local'
    path: '{data_dir}/key_store.db'

output_template:
  movies: '{title}.{year}.{quality}.{source}.WEB-DL.{video}.{audio}-{tag}'
  series: '{title}.{season_episode}.{episode_name}.{quality}.{source}.WEB-DL.{video}.{audio}-{tag}'
  use_last_audio: false

profiles:
  default: 'default'

proxies: {}

nordvpn: {}

# Retry failed HTTP requests automatically.
network:
  retry_count: 3 # Max attempts (0 = disabled)
  retry_backoff: 0.5 # Seconds between retries (doubles each attempt)

# Post-download subtitle conversion options.
subtitles:
  convert_to_srt: false